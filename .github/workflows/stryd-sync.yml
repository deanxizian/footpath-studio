name: Daily Stryd Footpath

on:
  schedule:
    # 03:30 Asia/Shanghai, once a day. GitHub may delay scheduled runs.
    - cron: '30 19 * * *'
  workflow_dispatch:
    inputs:
      max_downloads:
        description: 'Maximum Footpath checks (1–500)'
        type: string
        default: '100'
      recheck_all:
        description: 'Also recheck archived historical Footpath'
        type: boolean
        default: false
      refresh_session:
        description: 'Also test token refresh within this run'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: stryd-daily-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Restore optional fetch progress (no credentials)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        continue-on-error: true
        with:
          path: .cache/stryd-checks.json
          key: stryd-checks-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: stryd-checks-v1-
      - name: Update monthly Releases and refresh the website
        run: python scripts/stryd/sync.py
        env:
          GH_TOKEN: ${{ github.token }}
          STRYD_EMAIL: ${{ secrets.STRYD_EMAIL }}
          STRYD_PASSWORD: ${{ secrets.STRYD_PASSWORD }}
          MAX_DOWNLOADS: ${{ inputs.max_downloads || '100' }}
          RECHECK_ALL: ${{ inputs.recheck_all && 'true' || 'false' }}
          REFRESH_SESSION: ${{ inputs.refresh_session && 'true' || 'false' }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          STRYD_SITE_URL: ${{ vars.STRYD_SITE_URL }}
      - name: Save optional fetch progress (no credentials)
        if: ${{ always() && !cancelled() && hashFiles('.cache/stryd-checks.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        continue-on-error: true
        with:
          path: .cache/stryd-checks.json
          key: stryd-checks-v1-${{ github.run_id }}-${{ github.run_attempt }}

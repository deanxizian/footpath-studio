name: Daily Stryd Footpath

on:
  schedule:
    # 06:20 Asia/Shanghai, once a day. GitHub may delay scheduled runs.
    - cron: '20 22 * * *'
  workflow_dispatch:
    inputs:
      max_downloads:
        description: 'Maximum Footpath checks (1–500)'
        type: string
        default: '100'
      recheck_all:
        description: 'Also recheck archived historical Footpath'
        type: boolean
        default: false
      refresh_session:
        description: 'Validate session rotation and encrypted persistence'
        type: boolean
        default: false
      deploy_site:
        description: 'Rebuild the website even when its data is already current'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: stryd-daily-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main' && vars.STRYD_SYNC_ENABLED == 'true'
    environment: stryd-sync
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/stryd/requirements.txt
      - name: Update monthly Releases and refresh the website
        run: python scripts/stryd/sync.py
        env:
          GH_TOKEN: ${{ github.token }}
          STRYD_AUTH_KEY: ${{ secrets.STRYD_AUTH_KEY }}
          STRYD_STATE_RELEASE_ID: ${{ vars.STRYD_STATE_RELEASE_ID }}
          MAX_DOWNLOADS: ${{ inputs.max_downloads || '100' }}
          RECHECK_ALL: ${{ inputs.recheck_all && 'true' || 'false' }}
          REFRESH_SESSION: ${{ inputs.refresh_session && 'true' || 'false' }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          STRYD_SITE_URL: ${{ vars.STRYD_SITE_URL }}
          DEPLOY_SITE: ${{ inputs.deploy_site && 'true' || 'false' }}
